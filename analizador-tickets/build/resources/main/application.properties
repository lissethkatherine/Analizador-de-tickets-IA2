# Nombre de la app (solo informativo)
spring.application.name=analizador-tickets
# Puerto donde corre Spring Boot. El frontend tambien se sirve desde aca: http://localhost:8081
server.port=8081

spring.config.import=optional:file:.env[.properties]

# ---------- n8n ----------
app.n8n.webhook-url=${N8N_WEBHOOK_URL:https://germinate-had-heroism.ngrok-free.dev/webhook/analizar-ticket}

# ---------- PostgreSQL ----------
# En el puerto 5433
spring.datasource.url=jdbc:postgresql://localhost:5433/tickets
spring.datasource.username=tickets
spring.datasource.password=tickets

spring.datasource.driver-class-name=org.postgresql.Driver

# update = Hibernate crea/actualiza las tablas solo segun mis entidades (comodo para desarrollar)
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que se ejecuta (util para aprender y depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
